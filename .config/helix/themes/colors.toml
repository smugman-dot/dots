# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#9ccbfb"
"type" = "#b9c8da"
"type.enum.variant" = "#b9c8da"
"constructor" = "#cfe5ff"

"constant" = "#d4bee6"
"constant.character" = "#d4bee6"
"constant.character.escape" = "#504060"

"string" = "#9ccbfb"
"string.regexp" = "#504060"
"string.special" = "#cfe5ff"
"string.special.symbol" = "#ffb4ab"

"comment" = { fg = "#c2c7cf", modifiers = ["italic"] }

"variable" = "#e0e2e8"
"variable.parameter" = { fg = "#93000a", modifiers = ["italic"] }
"variable.builtin" = "#ffb4ab"
"variable.other.member" = "#9ccbfb"

"label" = "#cfe5ff"

"punctuation" = "#c2c7cf"
"punctuation.special" = "#b9c8da"

"keyword" = "#9ccbfb"
"keyword.control.conditional" = { fg = "#9ccbfb", modifiers = ["italic"] }

"operator" = "#b9c8da"

"function" = "#9ccbfb"
"function.macro" = "#124a73"

"tag" = "#9ccbfb"
"namespace" = { fg = "#b9c8da", modifiers = ["italic"] }

"special" = "#9ccbfb"

# --- Markup ---

"markup.heading.1" = "#ffb4ab"
"markup.heading.2" = "#9ccbfb"
"markup.heading.3" = "#b9c8da"
"markup.heading.4" = "#d4bee6"
"markup.heading.5" = "#cfe5ff"
"markup.heading.6" = "#124a73"

"markup.list" = "#b9c8da"
"markup.list.unchecked" = "#c2c7cf"
"markup.list.checked" = "#cfe5ff"

"markup.bold" = { fg = "#9ccbfb", modifiers = ["bold"] }
"markup.italic" = { fg = "#b9c8da", modifiers = ["italic"] }

"markup.link.url" = { fg = "#9ccbfb", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#cfe5ff"
"markup.link.label" = "#d4bee6"
"markup.raw" = "#f0dbff"
"markup.quote" = "#504060"

# --- Diff ---

"diff.plus" = "#d4bee6"
"diff.minus" = "#ffb4ab"
"diff.delta" = "#9ccbfb"

# --- UI Elements ---

"ui.background" = { fg = "#e0e2e8" }

"ui.linenr" = { fg = "#c2c7cf" }
"ui.linenr.selected" = { fg = "#cfe5ff" }

"ui.statusline" = { fg = "#cfe5ff" }
"ui.statusline.inactive" = { fg = "#c2c7cf" }
"ui.statusline.normal" = { fg = "#101418", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#101418", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#101418", modifiers = ["bold"] }

"ui.popup" = { fg = "#e0e2e8" }
"ui.window" = { fg = "#c2c7cf" }
"ui.help" = { fg = "#c2c7cf" }

"ui.bufferline" = { fg = "#c2c7cf" }
"ui.bufferline.active" = { fg = "#003354", bg = "#9ccbfb", underline = { color = "#9ccbfb", style = "line" } }
"ui.bufferline.background" = {}

"ui.text" = "#e0e2e8"
"ui.text.focus" = { fg = "#9ccbfb", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#c2c7cf" }
"ui.text.directory" = { fg = "#9ccbfb" }

"ui.virtual" = "#c2c7cf"
"ui.virtual.ruler" = {}
"ui.virtual.indent-guide" = "#181c20"
"ui.virtual.inlay-hint" = { fg = "#c2c7cf" }
"ui.virtual.jump-label" = { fg = "#124a73", modifiers = ["bold"] }

"ui.selection" = { bg = "#42474e" }

"ui.cursor" = { fg = "#101418", bg = "#cfe5ff" }
"ui.cursor.primary" = { fg = "#101418", bg = "#cfe5ff" }
"ui.cursor.match" = { fg = "#cfe5ff", modifiers = ["bold"] }

"ui.highlight" = { bg = "#3a4857", modifiers = ["bold"] }

"ui.menu" = { fg = "#e0e2e8" }
"ui.menu.selected" = { fg = "#9ccbfb", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ffb4ab", underline = { color = "#ffb4ab", style = "curl" } }
"diagnostic.warning" = { fg = "#b9c8da", underline = { color = "#b9c8da", style = "curl" } }
"diagnostic.info" = { fg = "#d4bee6", underline = { color = "#d4bee6", style = "curl" } }
"diagnostic.hint" = { fg = "#504060", underline = { color = "#504060", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ffb4ab"
warning = "#d4bee6"
info = "#9ccbfb"
hint = "#b9c8da"
