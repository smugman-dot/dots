# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#ffb3b1"
"type" = "#e6bdbb"
"type.enum.variant" = "#e6bdbb"
"constructor" = "#ffdad8"

"constant" = "#e4c18d"
"constant.character" = "#e4c18d"
"constant.character.escape" = "#5a4319"

"string" = "#ffb3b1"
"string.regexp" = "#5a4319"
"string.special" = "#ffdad8"
"string.special.symbol" = "#ffb4ab"

"comment" = { fg = "#d7c1c0", modifiers = ["italic"] }

"variable" = "#f0dedd"
"variable.parameter" = { fg = "#93000a", modifiers = ["italic"] }
"variable.builtin" = "#ffb4ab"
"variable.other.member" = "#ffb3b1"

"label" = "#ffdad8"

"punctuation" = "#d7c1c0"
"punctuation.special" = "#e6bdbb"

"keyword" = "#ffb3b1"
"keyword.control.conditional" = { fg = "#ffb3b1", modifiers = ["italic"] }

"operator" = "#e6bdbb"

"function" = "#ffb3b1"
"function.macro" = "#733334"

"tag" = "#ffb3b1"
"namespace" = { fg = "#e6bdbb", modifiers = ["italic"] }

"special" = "#ffb3b1"

# --- Markup ---

"markup.heading.1" = "#ffb4ab"
"markup.heading.2" = "#ffb3b1"
"markup.heading.3" = "#e6bdbb"
"markup.heading.4" = "#e4c18d"
"markup.heading.5" = "#ffdad8"
"markup.heading.6" = "#733334"

"markup.list" = "#e6bdbb"
"markup.list.unchecked" = "#d7c1c0"
"markup.list.checked" = "#ffdad8"

"markup.bold" = { fg = "#ffb3b1", modifiers = ["bold"] }
"markup.italic" = { fg = "#e6bdbb", modifiers = ["italic"] }

"markup.link.url" = { fg = "#ffb3b1", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#ffdad8"
"markup.link.label" = "#e4c18d"
"markup.raw" = "#ffdeac"
"markup.quote" = "#5a4319"

# --- Diff ---

"diff.plus" = "#e4c18d"
"diff.minus" = "#ffb4ab"
"diff.delta" = "#ffb3b1"

# --- UI Elements ---

"ui.background" = { fg = "#f0dedd" }

"ui.linenr" = { fg = "#d7c1c0" }
"ui.linenr.selected" = { fg = "#ffdad8" }

"ui.statusline" = { fg = "#ffdad8" }
"ui.statusline.inactive" = { fg = "#d7c1c0" }
"ui.statusline.normal" = { fg = "#1a1111", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#1a1111", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#1a1111", modifiers = ["bold"] }

"ui.popup" = { fg = "#f0dedd" }
"ui.window" = { fg = "#d7c1c0" }
"ui.help" = { fg = "#d7c1c0" }

"ui.bufferline" = { fg = "#d7c1c0" }
"ui.bufferline.active" = { fg = "#571d1f", bg = "#ffb3b1", underline = { color = "#ffb3b1", style = "line" } }
"ui.bufferline.background" = {}

"ui.text" = "#f0dedd"
"ui.text.focus" = { fg = "#ffb3b1", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#d7c1c0" }
"ui.text.directory" = { fg = "#ffb3b1" }

"ui.virtual" = "#d7c1c0"
"ui.virtual.ruler" = {}
"ui.virtual.indent-guide" = "#231919"
"ui.virtual.inlay-hint" = { fg = "#d7c1c0" }
"ui.virtual.jump-label" = { fg = "#733334", modifiers = ["bold"] }

"ui.selection" = { bg = "#524342" }

"ui.cursor" = { fg = "#1a1111", bg = "#ffdad8" }
"ui.cursor.primary" = { fg = "#1a1111", bg = "#ffdad8" }
"ui.cursor.match" = { fg = "#ffdad8", modifiers = ["bold"] }

"ui.highlight" = { bg = "#5d3f3e", modifiers = ["bold"] }

"ui.menu" = { fg = "#f0dedd" }
"ui.menu.selected" = { fg = "#ffb3b1", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ffb4ab", underline = { color = "#ffb4ab", style = "curl" } }
"diagnostic.warning" = { fg = "#e6bdbb", underline = { color = "#e6bdbb", style = "curl" } }
"diagnostic.info" = { fg = "#e4c18d", underline = { color = "#e4c18d", style = "curl" } }
"diagnostic.hint" = { fg = "#5a4319", underline = { color = "#5a4319", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ffb4ab"
warning = "#e4c18d"
info = "#ffb3b1"
hint = "#e6bdbb"
