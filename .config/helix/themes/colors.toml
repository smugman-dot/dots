# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#bdc2ff"
"type" = "#c4c4dd"
"type.enum.variant" = "#c4c4dd"
"constructor" = "#dfe0ff"

"constant" = "#e7b9d6"
"constant.character" = "#e7b9d6"
"constant.character.escape" = "#5e3c53"

"string" = "#bdc2ff"
"string.regexp" = "#5e3c53"
"string.special" = "#dfe0ff"
"string.special.symbol" = "#ffb4ab"

"comment" = { fg = "#c7c5d0", modifiers = ["italic"] }

"variable" = "#e4e1e9"
"variable.parameter" = { fg = "#93000a", modifiers = ["italic"] }
"variable.builtin" = "#ffb4ab"
"variable.other.member" = "#bdc2ff"

"label" = "#dfe0ff"

"punctuation" = "#c7c5d0"
"punctuation.special" = "#c4c4dd"

"keyword" = "#bdc2ff"
"keyword.control.conditional" = { fg = "#bdc2ff", modifiers = ["italic"] }

"operator" = "#c4c4dd"

"function" = "#bdc2ff"
"function.macro" = "#3c4279"

"tag" = "#bdc2ff"
"namespace" = { fg = "#c4c4dd", modifiers = ["italic"] }

"special" = "#bdc2ff"

# --- Markup ---

"markup.heading.1" = "#ffb4ab"
"markup.heading.2" = "#bdc2ff"
"markup.heading.3" = "#c4c4dd"
"markup.heading.4" = "#e7b9d6"
"markup.heading.5" = "#dfe0ff"
"markup.heading.6" = "#3c4279"

"markup.list" = "#c4c4dd"
"markup.list.unchecked" = "#c7c5d0"
"markup.list.checked" = "#dfe0ff"

"markup.bold" = { fg = "#bdc2ff", modifiers = ["bold"] }
"markup.italic" = { fg = "#c4c4dd", modifiers = ["italic"] }

"markup.link.url" = { fg = "#bdc2ff", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#dfe0ff"
"markup.link.label" = "#e7b9d6"
"markup.raw" = "#ffd7ef"
"markup.quote" = "#5e3c53"

# --- Diff ---

"diff.plus" = "#e7b9d6"
"diff.minus" = "#ffb4ab"
"diff.delta" = "#bdc2ff"

# --- UI Elements ---

"ui.background" = { fg = "#e4e1e9" }

"ui.linenr" = { fg = "#c7c5d0" }
"ui.linenr.selected" = { fg = "#dfe0ff" }

"ui.statusline" = { fg = "#dfe0ff" }
"ui.statusline.inactive" = { fg = "#c7c5d0" }
"ui.statusline.normal" = { fg = "#131318", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#131318", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#131318", modifiers = ["bold"] }

"ui.popup" = { fg = "#e4e1e9" }
"ui.window" = { fg = "#c7c5d0" }
"ui.help" = { fg = "#c7c5d0" }

"ui.bufferline" = { fg = "#c7c5d0" }
"ui.bufferline.active" = { fg = "#252b61", bg = "#bdc2ff", underline = { color = "#bdc2ff", style = "line" } }
"ui.bufferline.background" = {}

"ui.text" = "#e4e1e9"
"ui.text.focus" = { fg = "#bdc2ff", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#c7c5d0" }
"ui.text.directory" = { fg = "#bdc2ff" }

"ui.virtual" = "#c7c5d0"
"ui.virtual.ruler" = {}
"ui.virtual.indent-guide" = "#1b1b21"
"ui.virtual.inlay-hint" = { fg = "#c7c5d0" }
"ui.virtual.jump-label" = { fg = "#3c4279", modifiers = ["bold"] }

"ui.selection" = { bg = "#46464f" }

"ui.cursor" = { fg = "#131318", bg = "#dfe0ff" }
"ui.cursor.primary" = { fg = "#131318", bg = "#dfe0ff" }
"ui.cursor.match" = { fg = "#dfe0ff", modifiers = ["bold"] }

"ui.highlight" = { bg = "#444559", modifiers = ["bold"] }

"ui.menu" = { fg = "#e4e1e9" }
"ui.menu.selected" = { fg = "#bdc2ff", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ffb4ab", underline = { color = "#ffb4ab", style = "curl" } }
"diagnostic.warning" = { fg = "#c4c4dd", underline = { color = "#c4c4dd", style = "curl" } }
"diagnostic.info" = { fg = "#e7b9d6", underline = { color = "#e7b9d6", style = "curl" } }
"diagnostic.hint" = { fg = "#5e3c53", underline = { color = "#5e3c53", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ffb4ab"
warning = "#e7b9d6"
info = "#bdc2ff"
hint = "#c4c4dd"
